# Project-wide Gradle settings.

# AndroidX configuration
android.useAndroidX=true

# Suppress compileSdk=35 warning (AGP 8.5.2 tested up to 34)
android.suppressUnsupportedCompileSdk=35

# Enables namespacing of each library's R class so that its R class includes only the resources
# declared in the library itself and none from the library's dependencies.
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# JVM target for Kotlin compilation
kotlin.jvm.target.validation.mode=warning

# Increase memory for Gradle build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache
org.gradle.configuration-cache=false
